name: Archive

# Builds this fork from source and publishes the static library as a release asset.
#
# **It lives here rather than in the embedder** because the event that invalidates an
# archive is a push to *this* repository, and only this repository sees it. From the
# embedder's side the chain was "push here, bump the submodule there, remember to dispatch"
# -- and forgetting the last step left a stale archive to be caught downstream instead of
# never existing.
#
# Only Linux. The macOS arm64 asset is built on the maintainer's machine, where a warm
# ccache turns 2-3 hours of runner time into about twelve minutes, and uploaded into the
# same release; `v8-patch/README.md` in the embedder has those three commands.
# **Every** push, with no path filter, because the consumer keys an archive by this
# repository's commit rather than by the files that reach the archive. That key is
# deliberate -- the list of inputs that reach a `librusty_v8.a` is long (this tree's
# C++, `binding.cc`, the gn args in `build.rs`, the pinned clang and Rust toolchains,
# the two revisions `v8/DEPS` names), and a content key that missed one would link a
# V8 built from other sources *silently*, where an over-strict key merely fails. But
# it means a commit with no release is a commit the consumer cannot use, so filtering
# paths here would leave holes: a README-only commit would build nothing, publish
# nothing, and strand anyone who pointed a submodule at it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A superseded build is worth nothing: the tag it would publish under names the commit
# that is no longer main.
concurrency:
  group: archive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    # **glibc 2.28, and that is the whole reason for the container.** The runner's own image
    # is glibc 2.39, and V8 compiled against a glibc that new emits calls to `__isoc23_sscanf`
    # and its `strtol` family -- symbols that arrived in **2.38**. Measured: 26 such
    # references in an archive built on the runner, and zero of them present in Debian 11's
    # libc, so linking `pane-cli` against it on a Debian 11 base fails with
    # "undefined symbol: __isoc23_sscanf". Note what that is *not*: a versioned `@GLIBC_2.38`
    # reference. `nm | grep @GLIBC` on the archive finds nothing, because the dependency is a
    # different symbol *name* rather than a symbol *version* -- which is how an archive can
    # look portable and not be.
    #
    # Building against an old glibc fixes it in the direction that composes: an archive built
    # on an old one links on new ones too, so this stays one artifact rather than one per
    # distribution.
    #
    # **Debian 11 and not manylinux_2_28**, which was the first attempt and fails from the
    # other side. Chromium's *prebuilt* Rust toolchain -- the `bindgen` a V8 source build
    # runs -- needs `GLIBCXX_3.4.26`, and manylinux deliberately keeps its libstdc++ old so
    # that wheels stay compatible: AlmaLinux 8 has 3.4.25 and carries no newer runtime, not
    # even under `gcc-toolset-14`. So it is old enough for the target and too old for the
    # toolchain. Debian 11 satisfies both ends -- glibc 2.31 and GLIBCXX 3.4.28 -- and 2.31
    # is exactly the base this archive has to run on.
    container: debian:bullseye
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      # `libglib2.0-dev` because `build/config/linux/pkg_config.gni` runs pkg-config for glib
      # during `gn gen` -- measured: without it the build dies in under two minutes with
      # "Package 'glib-2.0', required by 'virtual:world', not found". `git` because a
      # container job's checkout falls back to a tarball without it, and the Publish step
      # below reads `git rev-parse` for the tag. gn, ninja, clang and the Rust toolchain are
      # downloaded by the crate itself.
      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential python3 curl ca-certificates git pkg-config libglib2.0-dev \
            xz-utils ccache

      # **Because a failure after the compile costs an hour.** `build.rs` picks ccache up off
      # the PATH by itself, and this job has now failed twice in its last mile -- once on
      # bindgen's libclang, once on bindgen's builtin headers -- each time discarding a
      # complete V8 build. The cache is keyed loosely on purpose: any hit at all turns the
      # retry from an hour into minutes.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /github/home/.cache/ccache
          key: ccache-v8-${{ github.sha }}
          restore-keys: |
            ccache-v8-

      # No rust in this image, and rustup honours the tree's `rust-toolchain.toml`.
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The two inputs crates.io excludes, at the revisions `v8/DEPS` pins.
      - name: Fetch the excluded inputs
        run: bash pane-deps.sh

      # **Where bindgen's libclang comes from**, which took two failed builds to find.
      #
      # `build_binding` runs bindgen after the archive is linked, and bindgen looks for a
      # `libclang.so` on `LIBCLANG_PATH`. Nothing sets that: on macOS it finds Xcode's, and
      # `build.rs` only downloads a libclang explicitly on Windows. So a Linux runner built
      # all of V8 and died 64 minutes in with "Bindgen requires Clang 21.1+", and again with
      # "couldn't find any valid shared libraries" -- because Chromium's *clang* package
      # carries only `libclang_rt.*`, and its `libclang` package (both platforms, 30 KB) is
      # nothing but Python bindings.
      #
      # It is in the **Rust toolchain** package, which a source build downloads anyway for
      # the ICU4X crates: `third_party/rust-toolchain/lib/libclang.so`. Fetched here rather
      # than installed from apt so bindgen uses the toolchain this tree pins instead of
      # whatever LLVM the distribution carries, and listed so that a layout change fails in
      # ten seconds rather than after an hour of compiling.
      - name: Download the pinned Rust toolchain, for bindgen's libclang
        run: |
          python3 tools/rust_toolchain.py
          ls -l third_party/rust-toolchain/lib/libclang*
          echo "LIBCLANG_PATH=$PWD/third_party/rust-toolchain/lib" >> "$GITHUB_ENV"
          # A libclang is not a clang: it carries no **resource directory**, so the builtin
          # headers are missing and `build_binding`'s bindgen dies on
          # "third_party/libc++/src/include/stddef.h: 'stddef.h' file not found" -- after V8
          # itself has compiled, 2358 of 2384 targets in, which is the expensive place to
          # find out. `stddef.h` is a freestanding compiler header, so gcc's copy answers it.
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(ls -d /usr/lib/gcc/x86_64-linux-gnu/*/include | head -1)" >> "$GITHUB_ENV"

      # Build and gate in one step, so that what gets published is what was tested.
      # `test_pane_apis` is why this fork exists; `test_api` is upstream's own 292 cases,
      # which is what would catch a patch that builds and breaks V8 somewhere else.
      - name: Build from source and test
        run: |
          V8_FROM_SOURCE=1 cargo test --release --test test_pane_apis
          V8_FROM_SOURCE=1 cargo test --release --test test_api

      - name: Publish
        run: |
          set -euo pipefail
          TAG="v8-152.1.0-$(git rev-parse --short=8 HEAD)"
          ASSET="librusty_v8_${TARGET}.a.gz"
          gzip -c target/release/gn_out/obj/librusty_v8.a > "/tmp/$ASSET"
          ls -lh "/tmp/$ASSET"

          # Provenance in the notes: the archive cannot say which pinned inputs went into
          # it, and those come from v8/DEPS rather than from anything written by hand.
          deps=$(python3 -c 'import sys; sys.path.insert(0, "tools"); from v8_deps import deps; print("\n".join("- %s %s" % (k, deps[k]) for k in ("third_party/icu", "third_party/rust")))')
          {
            echo "Patched V8 built from $GITHUB_SHA."
            echo
            echo "Inputs fetched by pane-deps.sh, at the revisions v8/DEPS pins:"
            echo "$deps"
            echo
            echo "The macOS arm64 asset, when present, was built locally and uploaded here."
          } > /tmp/notes.md

          gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md --target "$GITHUB_SHA" \
            || echo "release $TAG already exists, uploading into it"
          gh release upload "$TAG" "/tmp/$ASSET" --clobber
