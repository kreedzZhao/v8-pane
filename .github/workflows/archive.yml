name: Archive

# Builds this fork from source and publishes the static library as a release asset.
#
# **It lives here rather than in the embedder** because the event that invalidates an
# archive is a push to *this* repository, and only this repository sees it. From the
# embedder's side the chain was "push here, bump the submodule there, remember to dispatch"
# -- and forgetting the last step left a stale archive to be caught downstream instead of
# never existing.
#
# **Both platforms, as of 2026-08-27.** The macOS arm64 asset used to be built on the
# maintainer's machine and uploaded by hand -- a warm local ccache is about twelve minutes
# against 2-3 hours of runner time -- and the cost of that was not the minutes: a fork commit
# could publish a release carrying only the Linux asset, while `fetch-archive.sh` asks for the
# asset *in the release named by the current submodule commit*. Whoever was on a Mac found out,
# and only on a clean clone.
#
# **Every** push, with no path filter, because the consumer keys an archive by this
# repository's commit rather than by the files that reach the archive. That key is
# deliberate -- the list of inputs that reach a `librusty_v8.a` is long (this tree's
# C++, `binding.cc`, the gn args in `build.rs`, the pinned clang and Rust toolchains,
# the two revisions `v8/DEPS` names), and a content key that missed one would link a
# V8 built from other sources *silently*, where an over-strict key merely fails. But
# it means a commit with no release is a commit the consumer cannot use, so filtering
# paths here would leave holes: a README-only commit would build nothing, publish
# nothing, and strand anyone who pointed a submodule at it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A superseded build is worth nothing: the tag it would publish under names the commit
# that is no longer main.
concurrency:
  group: archive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    # **glibc 2.28, and that is the whole reason for the container.** The runner's own image
    # is glibc 2.39, and V8 compiled against a glibc that new emits calls to `__isoc23_sscanf`
    # and its `strtol` family -- symbols that arrived in **2.38**. Measured: 26 such
    # references in an archive built on the runner, and zero of them present in Debian 11's
    # libc, so linking `pane-cli` against it on a Debian 11 base fails with
    # "undefined symbol: __isoc23_sscanf". Note what that is *not*: a versioned `@GLIBC_2.38`
    # reference. `nm | grep @GLIBC` on the archive finds nothing, because the dependency is a
    # different symbol *name* rather than a symbol *version* -- which is how an archive can
    # look portable and not be.
    #
    # Building against an old glibc fixes it in the direction that composes: an archive built
    # on an old one links on new ones too, so this stays one artifact rather than one per
    # distribution.
    #
    # **Debian 11 and not manylinux_2_28**, which was the first attempt and fails from the
    # other side. Chromium's *prebuilt* Rust toolchain -- the `bindgen` a V8 source build
    # runs -- needs `GLIBCXX_3.4.26`, and manylinux deliberately keeps its libstdc++ old so
    # that wheels stay compatible: AlmaLinux 8 has 3.4.25 and carries no newer runtime, not
    # even under `gcc-toolset-14`. So it is old enough for the target and too old for the
    # toolchain. Debian 11 satisfies both ends -- glibc 2.31 and GLIBCXX 3.4.28 -- and 2.31
    # is exactly the base this archive has to run on.
    container: debian:bullseye
    # **A container job's default shell is `sh`, and on Debian that is dash.** Which cost a
    # whole build: `Publish` opens with `set -euo pipefail`, dash answers `set: Illegal option
    # -o pipefail`, and the step failed *after* 72 minutes of compiling with the finished
    # 38 MB archive sitting on the runner, about to be deleted with it. Nothing earlier caught
    # it because every other step happens to be dash-clean, so the one bashism in the job was
    # also the last thing to run.
    #
    # Set for the job rather than for that step: the next bashism should fail in seconds, not
    # after an hour of ccache-cold V8.
    defaults:
      run:
        shell: bash
    timeout-minutes: 350
    env:
      # No `GH_TOKEN` here any more: this job builds and no longer publishes, so the token
      # belongs to the job that needs it rather than to the one that runs the compiler.
      TARGET: x86_64-unknown-linux-gnu
      # **Why the ccache was doing nothing**, measured 2026-08-27 rather than reasoned: the run
      # restored a 166 MB entry saved by an *identical* source tree, compiled for 70 minutes --
      # the same 70 minutes the fully cold run took -- and saved a 332 MB entry afterwards.
      # Exactly twice 166 MB is the signature of total miss: the restored half was never read
      # and an equal new half was written beside it.
      #
      # ccache's default `compiler_check` is **mtime**, so the hash of every compilation
      # includes the compiler binary's size and modification time. The pinned clang is
      # downloaded fresh by `build_v8` on every run into `target/`, which is not cached, so its
      # mtime is new every time and every one of ~2400 objects misses. `content` hashes the
      # compiler's bytes instead: same clang, same hash, and the retry after a late failure
      # costs minutes instead of the hour that has now been paid five times.
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4

      # `libglib2.0-dev` because `build/config/linux/pkg_config.gni` runs pkg-config for glib
      # during `gn gen` -- measured: without it the build dies in under two minutes with
      # "Package 'glib-2.0', required by 'virtual:world', not found". `git` because a container
      # job's checkout falls back to downloading a tarball without it, which leaves no `.git`
      # -- not `pane-deps.sh`, which fetches subtree archives over curl on purpose. gn, ninja,
      # clang and the Rust toolchain are downloaded by the crate itself.
      - name: Install build dependencies
        run: |
          # **Debian 11 left LTS on 2026-08-31, and this job broke five days later, twice.**
          # First as a 404: deb.debian.org's bullseye-security is mid-removal, so update
          # still handed out an index naming `libperl5.32 +deb11u5` whose pool file was
          # already gone. Then, pointed at archive.debian.org's `main` alone, as "held
          # broken packages": the *image's* installed set is at security versions
          # (libglib2.0-0 2.66.8-1+deb11u8), the archive's main suite stops at the last
          # point release, and `libglib2.0-dev` requires its runtime at an equal version --
          # unsatisfiable with no security suite to pull from. (archive.debian.org does not
          # carry bullseye's debian-security tree yet; the migration is half done.)
          #
          # So the sources are **snapshot.debian.org, pinned to the day this job last
          # succeeded**. Both suites exist there at versions that agree with the image, and
          # a dated snapshot cannot be half-removed under this job again. The pin goes
          # stale on purpose: it describes the container, which is itself pinned to
          # `debian:bullseye`.
          #
          # Check-Valid-Until off because a snapshot's Release files are not re-signed;
          # their validity window lapsing is not information.
          SNAP=20260828T000000Z
          {
            echo "deb http://snapshot.debian.org/archive/debian/$SNAP bullseye main"
            echo "deb http://snapshot.debian.org/archive/debian-security/$SNAP bullseye-security main"
          } > /etc/apt/sources.list
          rm -rf /etc/apt/sources.list.d/*
          apt-get -o Acquire::Check-Valid-Until=false update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential python3 curl ca-certificates git pkg-config libglib2.0-dev \
            xz-utils ccache

      # **Because a failure after the compile costs an hour.** `build.rs` picks ccache up off
      # the PATH by itself, and this job has now failed twice in its last mile -- once on
      # bindgen's libclang, once on bindgen's builtin headers -- each time discarding a
      # complete V8 build. The cache is keyed loosely on purpose: any hit at all turns the
      # retry from an hour into minutes.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /github/home/.cache/ccache
          key: ccache-v8-${{ github.sha }}
          restore-keys: |
            ccache-v8-

      # No rust in this image, and rustup honours the tree's `rust-toolchain.toml`.
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The two inputs crates.io excludes, at the revisions `v8/DEPS` pins.
      - name: Fetch the excluded inputs
        run: bash pane-deps.sh

      # **Where bindgen's libclang comes from**, which took two failed builds to find.
      #
      # `build_binding` runs bindgen after the archive is linked, and bindgen looks for a
      # `libclang.so` on `LIBCLANG_PATH`. Nothing sets that: on macOS it finds Xcode's, and
      # `build.rs` only downloads a libclang explicitly on Windows. So a Linux runner built
      # all of V8 and died 64 minutes in with "Bindgen requires Clang 21.1+", and again with
      # "couldn't find any valid shared libraries" -- because Chromium's *clang* package
      # carries only `libclang_rt.*`, and its `libclang` package (both platforms, 30 KB) is
      # nothing but Python bindings.
      #
      # It is in the **Rust toolchain** package, which a source build downloads anyway for
      # the ICU4X crates: `third_party/rust-toolchain/lib/libclang.so`. Fetched here rather
      # than installed from apt so bindgen uses the toolchain this tree pins instead of
      # whatever LLVM the distribution carries, and listed so that a layout change fails in
      # ten seconds rather than after an hour of compiling.
      - name: Download the pinned Rust toolchain, for bindgen's libclang
        run: |
          python3 tools/rust_toolchain.py
          ls -l third_party/rust-toolchain/lib/libclang*
          echo "LIBCLANG_PATH=$PWD/third_party/rust-toolchain/lib" >> "$GITHUB_ENV"
          # **The libclang and the clang are in two different packages**, and `build_binding`
          # assumes one prefix holds both: it takes `LIBCLANG_PATH`, looks for `../bin/clang`
          # beside it, and asks that for `-print-resource-dir` to find the builtin headers.
          # Chromium's Rust toolchain has `bin/bindgen` and no `clang`, so that lookup fails
          # **silently** and the run dies later on a missing `stddef.h` -- 2358 of 2384
          # targets in, which is the expensive place to find out. Two attempts were spent on
          # the wrong end of it: `-I<gcc includes>` supplies the header and puts it *before*
          # libc++'s, which libc++ then rejects outright ("header search paths are not
          # configured properly").
          #
          # So download the clang package too and hand bindgen its resource directory.
          # `BINDGEN_EXTRA_CLANG_ARGS` is appended after `build_binding`'s own arguments,
          # which is the order its comment asks for: libc++ first, clang builtins after.
          python3 tools/clang/scripts/update.py --output-dir "$PWD/target/release/clang"
          resource=$("$PWD/target/release/clang/bin/clang" -print-resource-dir)
          ls -l "$resource/include/stddef.h"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isystem$resource/include" >> "$GITHUB_ENV"

      - name: Build from source
        run: |
          ccache -z
          V8_FROM_SOURCE=1 cargo build --release -p v8

      # **Because "is the cache working" was guesswork, and guessing cost an hour a round.**
      # The evidence available from outside a run is the cache entry's size and the restore
      # step's duration, and neither answers the question: 2026-08-27 restored a 166 MB entry
      # saved by an identical source tree in 2 seconds, and then compiled for over an hour --
      # which is what a cache full of misses looks like from here, and also what a working
      # cache plus a slow link looks like. `ccache -s` distinguishes them in one line.
      #
      # Its own step with `if: always()` so a failed build still reports, since a failed build
      # is exactly when the number matters.
      - name: ccache statistics
        if: always()
        run: ccache -s

      # **Saved even when the build failed**, which is the point of it being its own step.
      # Every failure this job has had came after the compile -- twice in bindgen, once in
      # the linker -- and `actions/cache` does not save on a failed job, so each retry paid
      # the hour again. `always()` breaks that loop: whatever compiled stays compiled.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /github/home/.cache/ccache
          key: ccache-v8-${{ github.sha }}

      # The gate is separate but still before `Publish`, so what gets published is what was
      # tested. `test_pane_apis` is why this fork exists; `test_api` is upstream's own 292
      # cases, which is what would catch a patch that builds and breaks V8 somewhere else.
      - name: Test the archive
        run: |
          V8_FROM_SOURCE=1 cargo test --release --test test_pane_apis
          V8_FROM_SOURCE=1 cargo test --release --test test_api

      # Compressed and handed off as an artifact, and **that is the point of the split**: an
      # artifact outlives a failed publish. Every failure this job has had landed after the
      # compile, and the last one -- one dash-incompatible `set -o pipefail` -- discarded a
      # finished 38 MB archive that had already passed its tests. Now the bytes survive the
      # run whatever the release step does, and are downloadable from it by hand.
      - name: Package the archive
        run: |
          mkdir -p dist
          gzip -c target/release/gn_out/obj/librusty_v8.a > "dist/librusty_v8_${TARGET}.a.gz"
          ls -lh "dist/librusty_v8_${TARGET}.a.gz"

          # Provenance beside the bytes: the archive cannot say which pinned inputs went into
          # it, and those come from v8/DEPS rather than from anything written by hand. Read
          # here because this is the job that has the tree; the release notes are written in
          # the next one, which does not.
          python3 -c 'import sys; sys.path.insert(0, "tools"); from v8_deps import deps; print("\n".join("- %s %s" % (k, deps[k]) for k in ("third_party/icu", "third_party/rust")))' > dist/deps.txt
          cat dist/deps.txt

      # In the workspace rather than `/tmp`, because the workspace is the directory both the
      # container and the artifact action agree about.
      - uses: actions/upload-artifact@v4
        with:
          name: archive-x86_64-unknown-linux-gnu
          path: dist/
          retention-days: 7

  # **The macOS arm64 archive, which used to be built by hand.** `v8-patch/README.md` carried a
  # four-step recipe ending in `gh release upload`, and the cost of that was not the twelve
  # minutes it takes on a warm local ccache: it was that a fork commit could be pushed, build a
  # Linux archive, publish a release, and leave the macOS asset behind at the previous commit --
  # while `fetch-archive.sh` asks for the asset *in the release named by the current commit*.
  # The failure is per-developer and silent until someone on a Mac runs a clean clone.
  #
  # It is slower here than locally -- the doc's own measurement is 2-3 hours against about
  # forty minutes cold on ten cores -- because the hosted runner has fewer of them. Free, since
  # the fork is public, and cached, so only the first one pays in full.
  macos:
    runs-on: macos-15
    env:
      TARGET: aarch64-apple-darwin
      # **Stated rather than inferred.** ccache 4 picks its directory from a chain that differs
      # by platform -- `CCACHE_DIR`, then `$XDG_CACHE_HOME/ccache`, then `~/Library/Caches/ccache`
      # on macOS and `~/.cache/ccache` elsewhere -- and a cache action pointed at the wrong one
      # of those saves an empty directory and reports success. Naming it makes the two agree.
      # `/Users/runner` is `$HOME` on this image; job-level `env` cannot expand it.
      CCACHE_DIR: /Users/runner/.ccache
      # Same reason as the Linux job: the pinned clang is re-downloaded every run, so an
      # mtime-based compiler check misses everything. See that job's comment for the numbers.
      CCACHE_COMPILERCHECK: content
    # Same reasoning as the Linux job, for free: macOS runners default to bash already, but a
    # `sh` default is exactly the kind of thing that differs between images.
    defaults:
      run:
        shell: bash
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # Much shorter than the Linux job's list, and the absences are the interesting part.
      # No container, because nothing here has to link against an old glibc -- that constraint
      # is about the machines `pane-cli` runs on, and they are Linux. No rustup, because the
      # image ships Rust and honours `rust-toolchain.toml`. No pinned clang and no
      # `LIBCLANG_PATH`: bindgen finds Xcode's libclang on macOS, which is precisely why the
      # two failures that cost this workflow two hours were Linux-only.
      # `brew list ||` because the image may already carry it, and a bare `brew install`
      # on an installed formula is a failure on some images and a warning on others.
      - name: Install ccache
        run: brew list ccache >/dev/null 2>&1 || brew install ccache

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /Users/runner/.ccache
          key: ccache-v8-macos-${{ github.sha }}
          restore-keys: |
            ccache-v8-macos-

      - name: Fetch the excluded inputs
        run: bash pane-deps.sh

      # **The same failure as Linux, in the same place, and this comment used to claim the
      # opposite.** It said bindgen finds Xcode's libclang on macOS "which is precisely why the
      # two failures that cost this workflow two hours were Linux-only". It does find one, and
      # on this image it is too old: 2026-08-27 the build died in bindgen with
      # `attribute '__visibility__' is not supported by '#pragma clang attribute'` out of
      # `third_party/libc++/src/include/*`, under a warning that says what it means --
      # "Libc++ only supports AppleClang 26.4 and later". The maintainer's Mac builds because
      # its Xcode is newer, which is why the local recipe never needed this.
      #
      # The fix is the Linux one, minus a step. `LIBCLANG_PATH` points at the pinned Rust
      # toolchain's `libclang.dylib` -- Chromium's own, so new enough for Chromium's libc++ by
      # construction. **No `BINDGEN_EXTRA_CLANG_ARGS` here**: `build.rs` takes the
      # `target_os == "macos"` branch, which passes `-isysroot $(xcrun --show-sdk-path)` and
      # never looks for a `clang` binary beside `LIBCLANG_PATH`, so the missing-`stddef.h`
      # trap that cost Linux two attempts does not exist on this side.
      #
      # Verified locally before pushing, which is the part that was missing from the last five
      # attempts: with a warm `gn_out`, `V8_FROM_SOURCE=1 cargo build -p v8` reaches
      # `build_binding` in seconds, and with this `LIBCLANG_PATH` it regenerated
      # `gn_out/src_binding.rs` instead of failing.
      - name: Point bindgen at the pinned libclang
        run: |
          python3 tools/rust_toolchain.py
          ls -l third_party/rust-toolchain/lib/libclang.dylib
          echo "LIBCLANG_PATH=$PWD/third_party/rust-toolchain/lib" >> "$GITHUB_ENV"

      - name: Build from source
        run: |
          ccache -z
          V8_FROM_SOURCE=1 cargo build --release -p v8

      - name: ccache statistics
        if: always()
        run: ccache -s

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /Users/runner/.ccache
          key: ccache-v8-macos-${{ github.sha }}

      - name: Test the archive
        run: |
          V8_FROM_SOURCE=1 cargo test --release --test test_pane_apis
          V8_FROM_SOURCE=1 cargo test --release --test test_api

      # No `deps.txt` here: both jobs would read the same two revisions out of the same
      # `v8/DEPS` at the same commit, and two artifacts carrying the same filename would race
      # to overwrite each other in the publish job's merge. One writer, no ambiguity.
      - name: Package the archive
        run: |
          mkdir -p dist
          gzip -c target/release/gn_out/obj/librusty_v8.a > "dist/librusty_v8_${TARGET}.a.gz"
          ls -lh "dist/librusty_v8_${TARGET}.a.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-aarch64-apple-darwin
          path: dist/
          retention-days: 7

  # **A third job, on the runner image, for one reason: `gh`.** It is not in `debian:bullseye`
  # and not in Debian 11's repositories, so `gh release create` inside the container fails --
  # which would have been the *next* hour lost, right behind the dash one. The runner image has
  # it, and publishing needs no old glibc; only compiling does.
  publish:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    # **`!cancelled()` rather than the default, so one platform cannot hold the other's
    # release.** With a plain `needs`, a macOS failure would leave a finished, tested Linux
    # archive unpublished -- the same shape as the dash failure, one job further out. So this
    # runs whenever either build got far enough to leave an artifact, and publishes what is
    # there. Whether both are present is a question about the release, and the release answers
    # it: `fetch-archive.sh` fails loudly on a missing asset for the platform it is on.
    if: ${{ !cancelled() }}
    steps:
      # `pattern` + `merge-multiple`, and no `name`: whichever builds succeeded left an
      # artifact, and a missing one is not an error here.
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # **`gh` needs to be told which repository**, because this job has no `checkout` and
          # therefore no `.git` -- and `gh release` infers the repo from git remotes. 2026-08-27
          # it failed with `failed to run git: fatal: not a git repository` while the finished
          # 39 MB Linux asset sat in `dist/` beside it. Stated rather than checked out: this job
          # wants the assets, not the source, and a 200 MB clone to satisfy an inference is the
          # wrong fix.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # **`${GITHUB_SHA:0:8}` and not `git rev-parse --short=8`**, which is what this said
          # and is not the same function: `--short=8` returns *at least* eight characters and
          # lengthens on ambiguity, while the consumer asks for a plain eight-character prefix
          # (`v8-patch/fetch-archive.sh`: `${FORK_SHA:0:8}`). They agree today by luck. The day
          # a prefix collides they would disagree, and the symptom would be a release nobody
          # can find rather than anything about V8.
          TAG="v8-152.1.0-${GITHUB_SHA:0:8}"

          # What actually arrived. Empty means both builds failed, and saying so beats
          # publishing an empty release for a commit the consumer will then ask assets of.
          assets=$(ls dist/librusty_v8_*.a.gz 2>/dev/null || true)
          if [ -z "$assets" ]; then
            echo "no archive was built for any platform; nothing to publish" >&2
            exit 1
          fi
          ls -lh $assets

          {
            echo "Patched V8 built from $GITHUB_SHA."
            echo
            echo "Inputs fetched by pane-deps.sh, at the revisions v8/DEPS pins:"
            cat dist/deps.txt 2>/dev/null || echo "- (the Linux job did not get far enough to read them)"
            echo
            echo "Assets in this release:"
            for asset in $assets; do echo "- $(basename "$asset")"; done
          } > /tmp/notes.md

          # **`view` first, rather than `create || echo "it already exists"`.** That `||` is how
          # the git error above got reported as "release already exists, uploading into it" --
          # it assumed the only way `create` can fail is that the tag is taken, so a real
          # failure printed a reassuring and false reason and the step died two lines later
          # with no explanation. Asking makes the two cases distinguishable.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; uploading into it"
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md --target "$GITHUB_SHA"
          fi
          # One call, both assets: `upload` takes a list, and --clobber makes a re-run idempotent.
          gh release upload "$TAG" $assets --clobber
